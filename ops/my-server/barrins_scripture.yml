---
# Dedicated playbook for Barrin's Scripture's scheduled scrape. This app
# has no HTTP-facing component (see apps/barrins_scripture/README.md) —
# it's a scheduled job, not a deployed web service — so no domain/SSL/
# reverse-proxy roles are involved here, unlike barrins_api.yml/docs.yml.
- name: Deploy/schedule the Barrin's Scripture scraper
  hosts: spigushe
  become: true
  gather_facts: false
  vars:
    username: spigushe
    scripture_scraper_repo: Spigushe/barrins-project
    scripture_scraper_repo_subdir: apps/barrins_scripture
    scripture_scraper_app_name: barrins_scripture
    # Defaults to staging until T1's rewrite is proven equivalent to
    # mtg_scraper (see that item's own done statement) — pass
    # -e scripture_scraper_git_branch=main once it's ready to cut over.
    scripture_scraper_git_branch: "{{ deploy_branch | default('staging') }}"
    # Which barrins_api the sweep posts to — independent of
    # scripture_scraper_git_branch, so e.g. main-branch code can still be
    # validated against the staging API as an intermediate step. Defaults
    # to staging so the sweep is never pointed at production by accident;
    # cutting over means passing both -e deploy_branch=main -e
    # deploy_env=production together.
    deploy_env: staging
    # Local, git-ignored .env — deployed to {{ scripture_scraper_config.work_dir
    # }}/.env on every run if present on this machine, skipped otherwise
    # (same pattern as barrins_api.yml's backend_env_file). Holds
    # BARRINS_API_URL for the sweep timer — see secrets/README.md to
    # create it. SCRIPTURE_INGEST_TOKEN is no longer part of this file
    # (superseded 2026-08-08 — see the scripture_ingest_token role below):
    # it's injected into the deployed .env from a single shared secret,
    # not hand-copied here and into secrets/barrins_api/*.env.
    scripture_scraper_env_file: "{{ playbook_dir }}/secrets/barrins_scripture/{{ deploy_env }}.env"

  roles:
    - role: github_token

    - role: scripture_ingest_token

    - role: scripture_scraper
      tags: [scripture, deploy]

  post_tasks:
    - name: Check whether a .env was actually deployed to inject the token into
      ansible.builtin.stat:
        path: "{{ scripture_scraper_config.work_dir }}/.env"
      register: scripture_deployed_env_stat
      tags: [scripture, deploy]

    - name: Inject the shared SCRIPTURE_INGEST_TOKEN into the deployed .env
      no_log: true
      ansible.builtin.lineinfile:
        path: "{{ scripture_scraper_config.work_dir }}/.env"
        regexp: "^SCRIPTURE_INGEST_TOKEN="
        line: "SCRIPTURE_INGEST_TOKEN={{ scripture_ingest_token }}"
        owner: "{{ username }}"
        mode: "0600"
      when: scripture_deployed_env_stat.stat.exists
      tags: [scripture, deploy]

    - name: Reminder — the archive is pushed by the sweep, not this playbook
      ansible.builtin.debug:
        msg:
          - "{{ scripture_scraper_config.output_dir }} is now a real clone"
          - "of {{ scripture_scraper_config.archive_repo }} (T1, 2026-08-08)."
          - "This playbook only clones/updates it — committing and pushing"
          - "newly-scraped files happens inside barrins_scripture_sweep.sh"
          - "on every sweep tick, not here. Backfilling the archive's"
          - "history is still a separate, not-yet-run T1 task."
      tags: [scripture, deploy]

    - name: Reminder — the sweep timer runs independently of the scrape timer
      ansible.builtin.debug:
        msg:
          - "barrins_scripture_sweep.timer fires every 6 hours (T3/T8),"
          - "separate from barrins_scripture.timer's daily scrape. It"
          - "needs {{ scripture_scraper_config.work_dir }}/.env"
          - "(BARRINS_API_URL) to reach barrins_api — that file is"
          - "git-ignored (Constitution ss34) and only deployed if"
          - "{{ scripture_scraper_env_file }} exists on this machine."
          - "SCRIPTURE_INGEST_TOKEN is injected separately, above. See"
          - "secrets/README.md and secrets/barrins_scripture/{{ deploy_env }}.env.example."
      tags: [scripture, deploy]

    - name: Reminder — which barrins_api this sweep is currently targeting
      ansible.builtin.debug:
        msg:
          - "deploy_env={{ deploy_env }}: the sweep posts to whatever"
          - "BARRINS_API_URL is in {{ scripture_scraper_env_file }}."
          - "Validate against staging (the default) before cutting over"
          - "with -e deploy_branch=main -e deploy_env=production — see"
          - "docs/project/v2.0.0-bump/t8-scripture-karn-playbooks/index.md."
      tags: [scripture, deploy]
