---
# Dedicated playbook for the barrins_api backend — the single place that
# deploys/restarts it. Frontend playbooks (tolaria_news.yml, tamiyo_scroll.yml)
# only point their VITE_API_BASE_URL at whatever this playbook already has
# running; they must never redeploy the backend themselves (see the root
# README's "Multiple frontends sharing one backend" section).
- name: Deploy/restart the shared barrins_api backend
  hosts: spigushe
  become: true
  gather_facts: false
  vars:
    username: spigushe
    # Defaults to a full production deploy — the latest GitHub release tag
    # of barrins_api (Constitution ss25/ss27: production only ever deploys
    # released versions). Pass -e deploy_env=staging to deploy a
    # side-by-side staging instance instead, from the staging branch by
    # default — staging exists specifically to preview pre-release code).
    #   ansible-playbook barrins_api.yml -e deploy_env=staging \
    #     -e fastapi_backend_git_branch=my-feature
    # Roll production back to an older release:
    #   ansible-playbook barrins_api.yml -e fastapi_backend_release_tag=v1.2.3
    deploy_env: production
    env_suffix: "{{ '-staging' if deploy_env == 'staging' else '' }}"
    env_branch: "{{ 'staging' if deploy_env == 'staging' else 'main' }}"
    backend_port: "{{ 8511 if deploy_env == 'staging' else 8011 }}"
    backend_domain: "api{{ env_suffix }}.barrins-codex.org"
    # Local, git-ignored .env — deployed to ~/projects/{{ backend_domain
    # }}/apps/barrins_api/.env on every run if present on this machine,
    # skipped otherwise. See secrets/README.md to create it.
    backend_env_file: "{{ playbook_dir }}/secrets/barrins_api/{{ deploy_env }}.env"
    # Mirrors fastapi_backend's work_dir (app_root + repo_subdir), computed
    # from play-level vars instead of the role's fastapi_backend_config —
    # that var's work_dir is a lazily-templated string referencing
    # fastapi_backend_server_name, a role-call parameter that falls out of
    # scope once the role finishes, so post_tasks below can't reference it.
    backend_work_dir: "/home/{{ username }}/projects/{{ backend_domain }}/apps/barrins_api"

  pre_tasks:
    - name: Install WeasyPrint's native dependencies (S5 — Pango/cairo/GDK-Pixbuf)
      tags:
        - backend
        - deploy
      ansible.builtin.apt:
        state: present
        update_cache: true
        cache_valid_time: "3600"
        name:
          - libpango-1.0-0
          - libpangocairo-1.0-0
          - libcairo2
          - libgdk-pixbuf-2.0-0
          - shared-mime-info

  roles:
    - role: github_token

    - role: scripture_ingest_token

    - role: register_ssl
      tags:
        - backend
        - certs
      register_ssl_server_name: "{{ backend_domain }}"
      register_ssl_contact_name: martin.cuchet@gmail.com

    - role: fastapi_backend
      tags:
        - backend
      # This monorepo (Spigushe/barrins-project), not a dedicated barrins_api
      # repo — barrins_api lives at apps/barrins_api within it.
      fastapi_backend_repo: Spigushe/barrins-project
      fastapi_backend_repo_subdir: apps/barrins_api
      fastapi_backend_server_name: "{{ backend_domain }}"
      fastapi_backend_app_name: "api{{ env_suffix }}"
      fastapi_backend_port: "{{ backend_port }}"
      fastapi_backend_use_release_tag: "{{ deploy_env == 'production' }}"
      fastapi_backend_git_branch: "{{ env_branch }}"
      fastapi_backend_entrypoint: "app.main:app"
      fastapi_backend_env_file: "{{ backend_env_file }}"

    - role: backend_website
      tags:
        - backend
      backend_website_server_name: "{{ backend_domain }}"
      backend_website_port: "{{ backend_port }}"
      # Tolaria News BFF (T4): public, no per-user auth (I7, Option 4) --
      # rate-limiting is the actual anti-abuse control, not caller
      # identity. Scoped to this path only; Tamiyo Scroll's JWT-gated
      # routes are unaffected. Deliberately generous starting default
      # (public data, no per-request cost) -- retune once real per-page
      # request volume from apps/tolaria_news (T5) is measurable.
      backend_website_rate_limited_paths:
        - path: /bff/tolaria-news
          zone: tolaria_news
          rate: 20r/s
          burst: 80

  post_tasks:
    - name: Check whether a .env was actually deployed to inject the token into
      ansible.builtin.stat:
        path: "{{ backend_work_dir }}/.env"
      register: backend_deployed_env_stat
      tags: [backend, deploy]

    - name: Inject the shared SCRIPTURE_INGEST_TOKEN into the deployed .env
      no_log: true
      ansible.builtin.lineinfile:
        path: "{{ backend_work_dir }}/.env"
        regexp: "^SCRIPTURE_INGEST_TOKEN="
        line: "SCRIPTURE_INGEST_TOKEN={{ scripture_ingest_token }}"
        owner: "{{ username }}"
        mode: "0600"
      when: backend_deployed_env_stat.stat.exists
      notify: Restart the backend so it picks up the injected SCRIPTURE_INGEST_TOKEN
      tags: [backend, deploy]

    - name: Reminder — pending steps this playbook does not automate
      ansible.builtin.debug:
        msg:
          - "This playbook never runs Alembic. SSH in and run, from"
          - "~/projects/{{ backend_domain }}/apps/barrins_api:"
          - "'source .venv/bin/activate && alembic upgrade head' (or"
          - "'uv run alembic upgrade head' if using uv) to apply pending"
          - "migrations."
      tags: [backend, deploy]

    - name: Reminder — every frontend served by this backend
      ansible.builtin.debug:
        msg:
          - "barrins_api is shared by every frontend pointing its"
          - "VITE_API_BASE_URL at {{ backend_domain }} (currently Tolaria"
          - "News and Tamiyo Scroll). Restarting it here affects all of"
          - "them at once. ALLOWED_ORIGINS/FRONTEND_BASE_URL in"
          - "{{ backend_env_file }} must list every one of those origins —"
          - "see docs/content/ops/deployment/backend.md."
      tags: [backend, deploy]

    - name: Reminder — .env is local-only, not managed by git
      ansible.builtin.debug:
        msg:
          - "{{ backend_env_file }} is git-ignored (Constitution ss34) —"
          - "if this is a fresh checkout and that file doesn't exist yet on"
          - "this machine, the .env step above was skipped and the"
          - "server's existing .env (if any) was left untouched. See"
          - "secrets/README.md."
      tags: [backend, deploy]

  handlers:
    - name: Restart the backend so it picks up the injected SCRIPTURE_INGEST_TOKEN
      # fastapi_backend's own restart (roles/fastapi_backend/tasks/main.yml)
      # runs BEFORE this handler fires, so a token written/changed here is
      # never seen by the process it just restarted without a second restart
      # here (2026-08-09 incident: verify_scripture_token() 503'd every
      # ingest POST — settings.base.scripture_ingest_token was still None in
      # the already-running process even though the token was correctly on
      # disk).
      ansible.builtin.systemd:
        name: "api{{ env_suffix }}"
        state: restarted
      tags: [backend, deploy]
