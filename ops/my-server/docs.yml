---
# Dedicated playbook for the mkdocs documentation site. Self-hosted on
# this repo's own VPS rather than GitHub Pages — the user's GitHub
# account already hosts other, unrelated projects' Pages sites, and a
# shared account-level Pages workflow risks touching those (see B2,
# docs/project/first_production_release/b2-docs-deploy/index.md).
- name: Deploy the mkdocs documentation site
  hosts: spigushe
  become: true
  gather_facts: false
  vars:
    username: spigushe
    # Defaults to a full production deploy — the latest GitHub release tag
    # of this monorepo (Constitution ss25/ss27: production only ever
    # deploys released versions). Pass -e deploy_env=staging to deploy a
    # side-by-side staging instance instead, from the staging branch by
    # default.
    #   ansible-playbook docs.yml -e deploy_env=staging \
    #     -e docs_site_git_branch=my-feature
    # Roll production back to an older release:
    #   ansible-playbook docs.yml -e docs_site_release_tag=v1.2.3
    deploy_env: production
    env_suffix: "{{ '-staging' if deploy_env == 'staging' else '' }}"
    env_branch: "{{ 'staging' if deploy_env == 'staging' else 'main' }}"
    docs_domain: "docs{{ env_suffix }}.barrins-codex.org"

  roles:
    - role: github_token

    - role: register_ssl
      tags: [docs, certs]
      register_ssl_server_name: "{{ docs_domain }}"
      register_ssl_contact_name: martin.cuchet@gmail.com

    - role: docs_site
      tags: [docs, deploy]
      # This monorepo (Spigushe/barrins-project), not a dedicated docs
      # repo — the mkdocs project lives at docs/ within it.
      docs_site_repo: Spigushe/barrins-project
      docs_site_repo_subdir: docs
      docs_site_server_name: "{{ docs_domain }}"
      docs_site_app_name: "docs{{ env_suffix }}"
      docs_site_use_release_tag: "{{ deploy_env == 'production' }}"
      docs_site_git_branch: "{{ env_branch }}"

  post_tasks:
    - name: Reminder — this is a snapshot, not a live-updating site
      ansible.builtin.debug:
        msg:
          - "https://{{ docs_domain }} now serves docs/ as built from"
          - "{{ 'the latest GitHub release tag' if deploy_env == 'production' else env_branch }}"
          - "at deploy time. Re-run this playbook to pick up later"
          - "changes — nothing here watches the branch/tag for updates."
      tags: [docs, deploy]
