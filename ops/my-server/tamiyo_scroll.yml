---
# Frontend-only playbook for Tamiyo Scroll. It points VITE_API_BASE_URL at
# the shared barrins_api backend but never deploys/restarts it — that's
# barrins_api.yml's job exclusively (run it at least once, and again
# whenever barrins_api itself changes; see the root README's "Multiple
# frontends sharing one backend" section and docs/content/ops/deployment/frontend.md).
#
# Since the identity cutover (ADR-20) Tamiyo Scroll's login / signup /
# reset UI is the shared @barrins/goblin-guide library talking to
# barrins_identity directly in cookie mode, and its barrins_api calls
# carry an identity access token. This playbook therefore also needs
# identity's public origin at build time (VITE_IDENTITY_SERVICE_URL) and
# prebuilds libs/goblin_guide, exactly like goblin_guide.yml. Full account
# management (display name, email, password, deletion) is the standalone
# Goblin Guide app: the settings popup's "Manage my account" button links
# there, so this playbook also takes its origin at build time
# (VITE_GOBLIN_GUIDE_URL) — a reference only, it never deploys or restarts
# Goblin Guide (goblin_guide.yml does), nor barrins_identity / barrins_api.
# Run each of their own playbooks separately. Rollout context:
# docs/project/v2.0.0-bump/identity-goblin-guide-rollout.md (Phase 7+8).
- name: Deploy the Tamiyo Scroll frontend
  hosts: spigushe
  become: true
  gather_facts: false
  vars:
    username: spigushe
    # Defaults to a full production deploy — the latest GitHub release tag
    # of tamiyo_scroll (Constitution ss25/ss27: production only ever
    # deploys released versions). Pass -e deploy_env=staging to deploy a
    # side-by-side staging frontend instead, from the staging branch by
    # default — still pointed at barrins_api's own staging instance, run
    # barrins_api.yml -e deploy_env=staging separately to have one).
    #   ansible-playbook tamiyo_scroll.yml -e deploy_env=staging \
    #     -e react_frontend_git_branch=my-feature
    # Roll production back to an older release:
    #   ansible-playbook tamiyo_scroll.yml -e react_frontend_release_tag=v1.2.3
    deploy_env: production
    env_suffix: "{{ '-staging' if deploy_env == 'staging' else '' }}"
    env_branch: "{{ 'staging' if deploy_env == 'staging' else 'main' }}"
    backend_port: "{{ 8511 if deploy_env == 'staging' else 8011 }}"
    backend_domain: "api{{ env_suffix }}.barrins-codex.org"
    frontend_domain: "tamiyo{{ env_suffix }}.barrins-codex.org"
    identity_domain: "identity{{ env_suffix }}.barrins-codex.org"
    # "Manage my account" in the settings popup links here (build-time only —
    # this playbook never deploys or restarts Goblin Guide; goblin_guide.yml
    # does that).
    goblin_guide_domain: "goblin{{ env_suffix }}.barrins-codex.org"

  roles:
    - role: github_token

    - role: register_ssl
      tags: [frontend, certs]
      register_ssl_server_name: "{{ frontend_domain }}"
      register_ssl_contact_name: martin.cuchet@gmail.com

    - role: react_frontend
      tags: [frontend]
      # This monorepo (Spigushe/barrins-project), not a dedicated tamiyo_scroll
      # repo — Tamiyo Scroll lives at apps/tamiyo_scroll within it.
      react_frontend_repo: Spigushe/barrins-project
      react_frontend_repo_subdir: apps/tamiyo_scroll
      react_frontend_server_name: "{{ frontend_domain }}"
      react_frontend_app_name: "tamiyo{{ env_suffix }}"
      react_frontend_use_release_tag: "{{ deploy_env == 'production' }}"
      react_frontend_git_branch: "{{ env_branch }}"
      # apps/tamiyo_scroll depends on the shared library libs/goblin_guide
      # (@barrins/goblin-guide) as a `file:../../libs/goblin_guide` path
      # dep whose dist/ is git-ignored, so it must be installed and built
      # before the shell can compile — same shape as goblin_guide.yml.
      react_frontend_build_command: >-
        npm --prefix ../../libs/goblin_guide install
        && npm --prefix ../../libs/goblin_guide run build
        && npm run build
      react_frontend_build_env:
        VITE_API_BASE_URL: "https://{{ backend_domain }}"
        # Cookie mode (ADR-18/ADR-20): the login/account UI calls
        # barrins_identity directly. A bare origin, no path.
        VITE_IDENTITY_SERVICE_URL: "https://{{ identity_domain }}"
        # "Manage my account" navigates here (same tab) for account
        # management, with a return_to back to Tamiyo Scroll.
        VITE_GOBLIN_GUIDE_URL: "https://{{ goblin_guide_domain }}"

  post_tasks:
    - name: Reminder — this playbook does not deploy barrins_api
      ansible.builtin.debug:
        msg:
          - "This playbook only deploys the Tamiyo Scroll frontend. Run"
          - "'ansible-playbook barrins_api.yml{{ ' -e deploy_env=staging' if deploy_env == 'staging' else '' }}'"
          - "separately (at least once, and again whenever barrins_api"
          - "itself changes) to have a backend at {{ backend_domain }} for"
          - "this frontend to call."
          - "barrins_api's ALLOWED_ORIGINS (in"
          - "secrets/barrins_api/{{ deploy_env }}.env, see"
          - "secrets/README.md) must include https://{{ frontend_domain }}."
      tags: [frontend, deploy]

    - name: Reminder — identity must allow this origin (cookie mode)
      ansible.builtin.debug:
        msg:
          - "Tamiyo Scroll now logs in via barrins_identity directly"
          - "(ADR-20). In secrets/barrins_identity/{{ deploy_env }}.env,"
          - "https://{{ frontend_domain }} must be in ALLOWED_ORIGINS, and"
          - "identity must be in cookie mode (REFRESH_COOKIE_ENABLED=true,"
          - "REFRESH_COOKIE_DOMAIN={{ identity_domain }}). Then redeploy"
          - "identity: 'ansible-playbook barrins_identity.yml{{ ' -e deploy_env=staging' if deploy_env == 'staging' else '' }}'."
          - "barrins_api must be cut over too — see"
          - "docs/content/ops/deployment/identity-cutover.md."
      tags: [frontend, deploy]
