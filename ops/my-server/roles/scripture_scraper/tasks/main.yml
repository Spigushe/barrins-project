---
- name: Ensure app root folder is present
  ansible.builtin.file:
    state: directory
    path: "{{ scripture_scraper_config.app_root }}"
    owner: "{{ username }}"
    mode: "0755"

- name: Clone/update application repository
  become: false
  no_log: true
  tags:
    - deploy
  ansible.builtin.git:
    repo: "https://{{ scripture_scraper_config.github_token }}@github.com/{{ scripture_scraper_config.repo }}.git"
    dest: "{{ scripture_scraper_config.app_root }}"
    version: "{{ scripture_scraper_config.git_branch }}"
    update: true

- name: Ensure uv is installed
  become: false
  ansible.builtin.shell: |
    set -o pipefail
    curl -LsSf https://astral.sh/uv/install.sh | sh
  args:
    executable: /bin/bash
    creates: "/home/{{ username }}/.local/bin/uv"
  changed_when: true

- name: Ensure Python 3.14 is installed via uv
  become: false
  tags:
    - deploy
  ansible.builtin.command: "/home/{{ username }}/.local/bin/uv python install 3.14"
  register: scripture_scraper_uv_python_install
  changed_when: "'Already' not in scripture_scraper_uv_python_install.stdout"

- name: Install dependencies with uv
  become: false
  tags:
    - deploy
  ansible.builtin.command: "/home/{{ username }}/.local/bin/uv sync --all-extras --dev"
  args:
    chdir: "{{ scripture_scraper_config.work_dir }}"
  changed_when: true

- name: Ensure the JSON archive output directory exists
  ansible.builtin.file:
    path: "{{ scripture_scraper_config.output_dir }}"
    state: directory
    owner: "{{ username }}"
    mode: "0755"

- name: Deploy the scrape wrapper script
  ansible.builtin.template:
    src: barrins_scripture_scrape.sh.j2
    dest: /usr/local/bin/barrins_scripture_scrape.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy the systemd service
  ansible.builtin.template:
    src: barrins_scripture.service.j2
    dest: /etc/systemd/system/barrins_scripture.service
    mode: "0644"

- name: Deploy the systemd timer
  ansible.builtin.template:
    src: barrins_scripture.timer.j2
    dest: /etc/systemd/system/barrins_scripture.timer
    mode: "0644"

- name: Enable the timer
  tags:
    - deploy
  ansible.builtin.systemd:
    name: barrins_scripture.timer
    daemon_reload: true
    enabled: true
    state: started
