---
# scripture_scraper_teardown (default false) selects deploy.yml (the
# scrape+sweep systemd units, as before) or teardown.yml (removes them) —
# see teardown.yml's header comment / ADR-12.
- name: Deploy the scrape+sweep systemd units (default)
  ansible.builtin.import_tasks: deploy.yml
  when: not (scripture_scraper_teardown | default(false))

- name: Tear down the scrape+sweep systemd units (ADR-12 rollout)
  ansible.builtin.import_tasks: teardown.yml
  when: scripture_scraper_teardown | default(false)
