---
scripture_scraper_config:
  repo: "{{ scripture_scraper_repo }}"
  repo_subdir: "{{ scripture_scraper_repo_subdir | default('') }}"
  git_branch: "{{ scripture_scraper_git_branch | default('main') }}"
  app_name: "{{ scripture_scraper_app_name }}"
  app_root: "/home/{{ username }}/projects/{{ scripture_scraper_app_name }}"
  # Systemd unit base names and script paths are derived from app_name so
  # that side-by-side staging/production deploys (distinct app_name per
  # barrins_scripture.yml's env_suffix) get their own units instead of
  # fighting over one shared timer/service.
  service_name: "{{ scripture_scraper_app_name }}"
  sweep_service_name: "{{ scripture_scraper_app_name }}_sweep"
  scrape_script_path: "/usr/local/bin/{{ scripture_scraper_app_name }}_scrape.sh"
  sweep_script_path: "/usr/local/bin/{{ scripture_scraper_app_name }}_sweep.sh"
  work_dir: >-
    {{ '/home/' + username + '/projects/' + scripture_scraper_app_name
    + ('/' + scripture_scraper_repo_subdir if (scripture_scraper_repo_subdir | default('')) | length > 0 else '') }}
  output_dir: >-
    {{ scripture_scraper_output_dir | default('/home/' + username + '/projects/' + scripture_scraper_app_name
    + ('/' + scripture_scraper_repo_subdir if (scripture_scraper_repo_subdir | default('')) | length > 0 else '') + '/scraped') }}
  daily_hour: "{{ scripture_scraper_daily_hour | default(22) }}"
  github_token: "{{ scripture_scraper_github_token | default(github_token) }}"
  env_file: "{{ scripture_scraper_env_file | default('') }}"
  sweep_days: "{{ scripture_scraper_sweep_days | default(7) }}"
  archive_repo: "{{ scripture_scraper_archive_repo | default('Spigushe/mtg_decklist_cache') }}"
  archive_git_branch: "{{ scripture_scraper_archive_git_branch | default('main') }}"
  archive_commit_name: "{{ scripture_scraper_archive_commit_name | default(\"Barrin's Scripture\") }}"
  archive_commit_email: "{{ scripture_scraper_archive_commit_email | default('scripture@barrins-codex.org') }}"
