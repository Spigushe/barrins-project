site_name: Barrin's Codex
site_url: https://docs.barrins-codex.org/
site_dir: site
docs_dir: content

hooks:
    - hooks/sync_readmes.py
    - hooks/sync_changelogs.py
    - hooks/sync_constitution.py

exclude_docs: |
    _links.md
    changelog/_intro.md

theme:
    name: material
    language: fr
    features:
        - navigation.tabs
        - navigation.top
        - search.suggest

nav:
    - Home: index.md
    - Constitution: CLAUDE.md
    - Backend:
          - Home: back/index.md
          - Barrin's API:
                - Home: back/barrins_api/index.md
                - BFF Tamiyo Scroll: back/barrins_api/bff/tamiyo_scroll.md
                - BFF Tolaria News: back/barrins_api/bff/tolaria_news.md
                - JWT Authentication & Roles: back/barrins_api/auth_roles.md
                - Signup & Email Verification: back/barrins_api/signup_email_verification.md
          - Barrin's Identity:
                - Home: back/barrins_identity/index.md
                - Platform: back/barrins_identity/platform.md
    - Frontend:
          - Home: front/index.md
          - Tamiyo Scroll:
                - Home: front/tamiyo_scroll/index.md
                - Roadmap: front/tamiyo_scroll/roadmap.md
                - Implementation:
                      - Design: front/tamiyo_scroll/handoff.md
                      - Bootstrap: front/tamiyo_scroll/bootstrap.md
                - Incidents:
                      - Home: front/tamiyo_scroll/incidents/index.md
                      - Card tests personal deck id: front/tamiyo_scroll/incidents/2026-07-16-card-tests-personal-deck-id.md
          - Tolaria News:
                - Home: front/tolaria_news/index.md
    - Service:
          - Home: service/index.md
          - Barrin's Scripture:
                - Home: service/barrins_scripture/index.md
                - Incidents:
                      - Home: service/barrins_scripture/incidents/index.md
                      - MTGTop8 backfill OOM: service/barrins_scripture/incidents/2026-08-09-mtgtop8-oom.md
                      - MTGO network block: service/barrins_scripture/incidents/2026-08-10-mtgo-network-block.md
          - Karn Tablets: service/karn_tablets/index.md
    - Shared:
          - Home: shared/index.md
          - dc_calendar: shared/dc_calendar/index.md
    - Ops:
          - Home: ops/index.md
          - Architecture:
                - Home: ops/architecture/index.md
                - Infrastructure Independence: ops/architecture/independence.md
                - Decision Records: ops/architecture/decisions.md
          - Deployment:
                - Home: ops/deployment/index.md
                - Backend: ops/deployment/backend.md
                - Frontend: ops/deployment/frontend.md
                - Database (PostgreSQL & pgAdmin): ops/deployment/database.md
                - Docs Site: ops/deployment/docs_site.md
                - Backup & Restore: ops/deployment/backup.md
                - Rollback: ops/deployment/rollback.md
                - New Service Checklist: ops/deployment/new-service-checklist.md
          - Roles:
                - Home: ops/roles/index.md
                - Backend Website: ops/roles/backend_website/index.md
                - Create SSH Key: ops/roles/create_ssh_key/index.md
                - Docs Site: ops/roles/docs_site/index.md
                - FastAPI Backend: ops/roles/fastapi_backend/index.md
                - GitHub Token: ops/roles/github_token/index.md
                - MTGJSON Import Scheduler: ops/roles/mtgjson_import_scheduler/index.md
                - pgAdmin: ops/roles/pgadmin/index.md
                - Postgres Backup: ops/roles/postgres_backup/index.md
                - React Frontend: ops/roles/react_frontend/index.md
                - Register SSL: ops/roles/register_ssl/index.md
                - Scripture Ingest Token: ops/roles/scripture_ingest_token/index.md
                - Scripture Scraper: ops/roles/scripture_scraper/index.md
                - Setup Base User: ops/roles/setup_base_user/index.md
                - Setup Packages: ops/roles/setup_packages/index.md
          - Security:
                - Home: ops/security/index.md
                - Secrets Management: ops/security/secrets.md
          - Operations: ops/operations/index.md
          - Incidents:
                - Home: ops/incidents/index.md
                - PostgreSQL disk full: ops/incidents/2026-08-15-postgres-disk-full.md
          - Deployment Strategy: ops/deployment_strategy.md
          - Roadmap: ops/roadmap.md
    - Changelog:
          - Home: changelog/index.md
          - Barrin's API: changelog/barrins_api.md
          - Barrin's Identity: changelog/barrins_identity.md
          - Tamiyo Scroll: changelog/tamiyo_scroll.md
          - Tolaria News: changelog/tolaria_news.md
          - Ops: changelog/ops.md
          - Docs: changelog/docs.md

markdown_extensions:
    - toc:
          permalink: true
    - admonition
    - tables
    - pymdownx.superfences
