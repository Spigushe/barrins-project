name: ci

on:
  pull_request:
    branches: [staging, main, "proj/**"]
  push:
    branches: [staging, main, "proj/**"]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      back: ${{ steps.filter.outputs.back }}
      identity: ${{ steps.filter.outputs.identity }}
      front: ${{ steps.filter.outputs.front }}
      goblin_guide: ${{ steps.filter.outputs.goblin_guide }}
      scripture: ${{ steps.filter.outputs.scripture }}
      karn: ${{ steps.filter.outputs.karn }}
      ops: ${{ steps.filter.outputs.ops }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            back:
              - 'apps/barrins_api/**'
              - 'libs/dc_calendar/**'
            identity:
              - 'apps/barrins_identity/**'
              - 'libs/identity_client/**'
            front:
              - 'apps/tamiyo_scroll/**'
              - 'apps/tolaria_news/**'
            goblin_guide:
              - 'apps/goblin_guide/**'
              - 'libs/goblin_guide/**'
            scripture:
              - 'apps/barrins_scripture/**'
            karn:
              - 'apps/karn_tablets/**'
              - 'libs/dc_calendar/**'
            ops:
              - 'ops/my-server/**'
            docs:
              - 'docs/**'

  back:
    needs: changes
    if: needs.changes.outputs.back == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/barrins_api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/barrins
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/barrins_test
    steps:
      - uses: actions/checkout@v7
      - name: Install WeasyPrint's native dependencies (S5 — Pango/cairo/GDK-Pixbuf)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 shared-mime-info
      - name: Install uv
        uses: astral-sh/setup-uv@v7 # TO UPDATE if a newer version exists
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --all-extras --dev # requires pyproject.toml + uv.lock in apps/barrins_api
      - name: Generate ephemeral SECRET_KEY
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: CI checks (lint, security, types, tests)
        run: uv run python scripts/workflow_ci.py --no-fix

  identity:
    needs: changes
    if: needs.changes.outputs.identity == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      # barrins_identity owns its own database — never barrins_api's (§26.1).
      TEST_DATABASE_URL_BASE: postgresql+asyncpg://postgres:postgres@localhost:5432/barrins_identity
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/barrins_identity_test
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7 # TO UPDATE if a newer version exists
        with:
          enable-cache: true
      - name: Install barrins_identity deps
        run: uv sync --all-extras --dev
        working-directory: apps/barrins_identity
      - name: barrins_identity — CI checks (lint, security, types, tests)
        run: uv run python scripts/workflow_ci.py --no-fix
        working-directory: apps/barrins_identity
      - name: Install identity_client deps
        run: uv sync --all-extras --dev
        working-directory: libs/identity_client
      - name: identity_client — lint / format / types / tests
        working-directory: libs/identity_client
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check
          uv run pytest

  front:
    needs: changes
    if: needs.changes.outputs.front == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tamiyo_scroll
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build --if-present
      - run: npm test --if-present

  goblin_guide:
    needs: changes
    if: needs.changes.outputs.goblin_guide == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # The shared library first — the standalone shell resolves it as a
      # file: path dependency and needs its dist/ built.
      - name: goblin_guide library — lint / build / test
        working-directory: libs/goblin_guide
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run build
          npm test
      - name: goblin_guide shell — lint / build / test
        working-directory: apps/goblin_guide
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run build
          npm test

  scripture:
    needs: changes
    if: needs.changes.outputs.scripture == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/barrins_scripture
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --all-extras --dev
      - name: CI checks (lint, security, types, tests)
        run: uv run python scripts/workflow_ci.py --no-fix

  karn:
    needs: changes
    if: needs.changes.outputs.karn == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/karn_tablets
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --all-extras --dev
      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types (ty)
        run: uv run ty check
      - name: Tests (pytest)
        run: uv run pytest

  ops:
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Ansible collections
        run: uvx --from ansible-core ansible-galaxy collection install -r ops/my-server/requirements.yml
      - name: Lint playbooks
        run: uvx ansible-lint ops/my-server

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Markdownlint
        run: npx --yes markdownlint-cli2 "docs/content/**/*.md" "!docs/content/**/_links.md" "!docs/content/changelog/_intro.md" --config docs/.markdownlint.jsonc
      - name: Spellcheck (cspell)
        run: npx --yes cspell --config docs/cspell.json "docs/content/**/*.md" --exclude "docs/content/**/_links.md" --exclude "docs/content/changelog/_intro.md"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build MkDocs
        run: uvx --with mkdocs-material mkdocs build --strict -f docs/mkdocs.yml

  ci-required:
    if: always()
    needs: [changes, back, identity, front, goblin_guide, scripture, karn, ops, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no triggered job failed
        run: |
          for r in "${{ needs.back.result }}" "${{ needs.identity.result }}" "${{ needs.front.result }}" "${{ needs.goblin_guide.result }}" "${{ needs.scripture.result }}" "${{ needs.karn.result }}" "${{ needs.ops.result }}" "${{ needs.docs.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "A required job failed or was cancelled: $r"
              exit 1
            fi
          done
          echo "OK — all triggered jobs passed (non-triggered ones were correctly skipped)."
