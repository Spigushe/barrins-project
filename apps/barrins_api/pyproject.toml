[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "barrins_project"
version = "2.0.0"
authors = [
    { name = "Martin Cuchet", email = "martin.cuchet+barrins_project@gmail.com" }
]
description = "API meant to extract and provide data based on MTGO scrapping."
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["mtg", "Magic: the Gathering", "CCG", "MTGO"]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.140.13",
    "httpx>=0.28.1,<1.0",
    # Streaming JSON parser -- lets the MTGJSON import consume AllPrintings.json
    # (100k+ card rows) without buffering the whole document in memory.
    "ijson>=3.5.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.10.1",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
    # >=69.0: includes fixes for both CVE-2025-68616 and CVE-2026-49452 (see S5 ADR/I8).
    "weasyprint>=69.0",
    "dc-calendar",
    # Shared JWKS verification for identity tokens (ADR-17, ADR-20). Replaces
    # this app's old local python-jose / argon2 JWT + password stack.
    "identity-client",
]

[dependency-groups]
test = [
    "httpx>=0.28.1,<1.0",
    "lxml>=6.1.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    # Mocks the identity JWKS endpoint in auth tests.
    "respx>=0.22.0",
]
dev = [
    { include-group = "test" },
    "alembic>=1.18.5",
    "bandit[toml]>=1.9.4",
    "ruff>=0.16.0",
    "ty>=0.0.64",
    "zest.releaser[recommended]>=9.9.1",
]

[tool.setuptools.packages.find]
include = ["*"]

# required for dynamic version
[tool.setuptools_scm]

[tool.zest-releaser]
create-wheel = true

[tool.ruff]
line-length = 88
indent-width = 4
extend-exclude = [
    "alembic",
    "docs",
    "reports",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
    "A",   # flake8-builtins
]
ignore = ["E402", "E712", "F403", "S101"]  # S101: allow assert in tests

[tool.ruff.lint.flake8-bugbear]
# B008 treats any non-scalar-typed default (e.g. `list[str] | None`) as
# "mutable" regardless of the call inside it, so `Query(...)` false-positives
# on list-typed query params (scalar ones like `Query(1, ge=1)` are already
# exempt via B008's own immutable-annotation check). This is ruff's own
# documented escape hatch for exactly that FastAPI pattern.
extend-immutable-calls = ["fastapi.Query"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-line-length = "dynamic"

[tool.ty.environment]
python-version = "3.14"
# dc_calendar and identity_client are local editable dependencies (uv's
# setuptools editable install uses a MetaPathFinder .pth hook, which ty --
# unlike Python's own import machinery -- can't resolve statically without
# this hint).
extra-paths = ["../../libs/dc_calendar", "../../libs/identity_client"]

[tool.ty.src]
exclude = ["tests"]

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["scripts", "build", "dist", ".venv", "alembic"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::sqlalchemy.exc.SAWarning",
]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=app",
    "--cov-report=html",
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "api: marks tests as API tests",
    "db: marks tests requiring database",
    "performance: marks tests as performance benchmarks",
]

[tool.coverage.run]
source = ["app"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/alembic/*",
    "scripts/*",
]

[tool.coverage.report]
precision = 2
# Afficher les lignes manquantes
show_missing = true
skip_empty = true
skip_covered = false
# Seuil minimal de couverture (optionnel, fail si en dessous)
fail_under = 90

exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "@abstractmethod",
    "@abc.abstractmethod",
    "except ImportError:",
    "pass",
    "\\.\\.\\.",  # Ignorer les ellipsis
]

[tool.coverage.html]
directory = "reports/pytest_html_report"

[tool.uv.sources]
dc-calendar = { path = "../../libs/dc_calendar", editable = true }
identity-client = { path = "../../libs/identity_client", editable = true }
