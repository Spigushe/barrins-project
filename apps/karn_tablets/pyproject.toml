[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "karn_tablets"
version = "0.1.0"
authors = [
    { name = "Martin Cuchet", email = "martin.cuchet+barrins_project@gmail.com" }
]
description = "Metagame clustering & deck-type aggregation for Duel Commander tournament data, feeding Tolaria News and Tamiyo Scroll's admin dashboard."
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["mtg", "Magic: the Gathering", "CCG", "clustering", "metagame"]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 2 - Pre-Alpha",
    "Natural Language :: English",
    "Operating System :: OS Independent",
]
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary", # sync driver -- this is a scheduled batch job, not a web server (no asyncpg needed)
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn", # KMeans/DBSCAN/GaussianMixture, PCA, silhouette_score, TfidfTransformer
    "pydantic",
    "requests", # pushes results to barrins_api's POST /internal/karn/ingest
    "python-dotenv", # loads apps/karn_tablets/.env for local dev (systemd sets real env vars)
    "dc-calendar",
]

[project.scripts]
karn-tablets = "karn_tablets.__main__:main"

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
dev = [
    { include-group = "test" },
    "ruff>=0.15.22",
    "ty>=0.0.62",
]

[tool.setuptools.packages.find]
include = ["karn_tablets*"]

[tool.setuptools_scm]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
    "A",   # flake8-builtins
]
ignore = ["E402", "E712", "F403", "S101"]  # S101: allow assert in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-line-length = "dynamic"

[tool.ty.environment]
python-version = "3.14"
# dc_calendar is a local editable dependency (uv's setuptools editable
# install uses a MetaPathFinder .pth hook, which ty -- unlike Python's own
# import machinery -- can't resolve statically without this hint).
extra-paths = ["../dc_calendar"]

[tool.ty.src]
exclude = ["tests"]

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["scripts", "build", "dist", ".venv"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=karn_tablets",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["karn_tablets"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_empty = true
skip_covered = false
fail_under = 90

exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "@abstractmethod",
    "@abc.abstractmethod",
    "except ImportError:",
    "pass",
    "\\.\\.\\.",  # Ignore ellipsis
]

[tool.coverage.html]
directory = "reports/pytest_html_report"

[tool.uv.sources]
dc-calendar = { path = "../dc_calendar", editable = true }
